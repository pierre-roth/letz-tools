[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "letz-tools"
version = "0.1.7"
description = "Official Luxembourgish language references for ChatGPT, Claude and other agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf==7.1.0", "PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "skills/luxembourgish-writing/scripts"}

[tool.setuptools.packages.find]
where = ["skills/luxembourgish-writing/scripts"]
include = ["letztools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/luxembourgish-writing/scripts"]
